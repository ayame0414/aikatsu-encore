const KEY='aikatsu_trial_owned_v1';

let dbPromise=null;
function readLocal(){try{const raw=localStorage.getItem(KEY);const stamp=Number(localStorage.getItem(KEY+'_savedAt')||0);return {owned:raw?JSON.parse(raw)||{}:{},savedAt:stamp}}catch(e){return {owned:{},savedAt:0}}}

function openLocalDB(){
  if(dbPromise)return dbPromise;

    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);

  return dbPromise;
}
async function readIndexed(){try{const db=await openLocalDB();return await new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readonly');const r=tx.objectStore(IDB_STORE).get('owned');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}catch(e){return null}}
async function writeIndexed(value){try{const db=await openLocalDB();await new Promise((resolve,reject)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(value,'owned');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});return true}catch(e){return false}}
function saveLocal(){
  const savedAt=Date.now(); ownedSavedAt=savedAt;

  writeIndexed({owned, savedAt});
}
async function restoreBestLocal(){
  const indexed=await readIndexed();

  if(initialLocal.savedAt===0 && indexed && indexed.owned){owned=indexed.owned||{};ownedSavedAt=Number(indexed.savedAt||Date.now());try{localStorage.setItem(KEY,JSON.stringify(owned));localStorage.setItem(KEY+'_savedAt',String(ownedSavedAt))}catch(e){};return true}
  return false;
}
const availableSetIds=new Set((CATALOG.sets||[]).filter(s=>CATALOG.cards.some(c=>c.setId===s.id)).map(s=>s.id));

const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const count=id=>Number(owned[id]||0);

function allSets(){return(CATALOG.sets||[]).filter(s=>CATALOG.cards.some(c=>c.setId===s.id))}function setCards(){return CATALOG.cards.filter(c=>c.setId===currentSet)}
function alphaCompare(a,b){const A=String(a),B=String(b);const aLatin=/^[A-Za-z0-9]/.test(A),bLatin=/^[A-Za-z0-9]/.test(B);if(aLatin!==bLatin)return aLatin?1:-1;return A.localeCompare(B,aLatin?'en':'ja',{numeric:true,sensitivity:'base'})}

function renderFilters(){

function matches(c){const q=$('#q').value.trim().toLowerCase();if(q&&!`${c.id} ${c.name} ${c.brand||'ノーブランド'} ${c.type} ${c.rarity} ${c.category}`.toLowerCase().includes(q))return false;for(const k of ['type','brand','rarity','category']){const val=k==='brand'?(c.brand||'ノーブランド'):c[k];if(filters[k].size&&!filters[k].has(val))return false}if(filters.status.size){const own=count(c.id)>0;if(!(filters.status.has('所持')&&own||filters.status.has('未所持')&&!own))return false}return true}
function cardHtml(c){const n=count(c.id),brand=c.brand||'ノーブランド',meta=[c.rarity,brand,c.type].filter(Boolean).map(v=>`<span class="chip">${esc(v)}</span>`).join('');const image=c.image?`<img src="${esc(c.image)}" alt="${esc(c.name)}" loading="lazy">`:`<div class="noimage">No Image</div>`;return `<article class="card ${n?'':'unowned'}" data-card-id="${esc(c.id)}"><div class="body"><div class="id">${esc(c.id)}</div><div class="name">${esc(c.name)}</div><div class="picwrap"><div class="pic ${c.orientation==='landscape'?'landscape':''}">${image}</div></div><div class="cardmeta">${meta}</div><div class="counter"><button type="button" data-change="-1" data-id="${esc(c.id)}">−</button><output data-count-id="${esc(c.id)}">${n}</output><button type="button" data-change="1" data-id="${esc(c.id)}">＋</button></div></div></article>`}

function updateStats(list){const got=list.filter(c=>count(c.id)>0).length,copies=list.reduce((a,c)=>a+count(c.id),0);$('#kinds').textContent=got;$('#copies').textContent=copies;$('#missing').textContent=list.length-got;$('#rate').textContent=(got/(list.length||1)*100).toFixed(1)+'%'}

owned)throw Error();owned=x.owned||{};save();render();alert('バックアップを読み込みました。')}catch(e){alert('バックアップ形式を読み込めませんでした。')}};r.readAsText(f)};input.click()});$('#resetBtn').addEventListener('click',()=>{if(confirm('所持データをすべて消去します。よろしいですか？')){owned={};save();render()}});$('#updated').textContent=`カードデータ：${CATALOG.updatedAt} ／ ${CATALOG.cards.length}枚登録 ／ 端末保存対応`;
